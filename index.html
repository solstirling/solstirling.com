<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sol Stirling Maker Portfolio</title>
  <script src="projects-data.js?v=20260802-1"></script>
  <link rel="stylesheet" href="site.css?v=20260802-1">
</head>
<body>
  <main class="home-shell">
    <section class="site-frame sketch-hero" aria-labelledby="projects-title">
      <div class="hero-lockup">
        <a href="index.html" class="logo-only hero-logo" aria-label="Sol Stirling home">
          <img src="images/logo.png" alt="Sol Stirling logo">
        </a>
        <h1 id="projects-title">Sol Stirling</h1>
      </div>
    </section>

    <section class="site-frame projects-section" aria-label="Project cards">
      <div id="projects-grid" class="project-grid" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const portfolio = window.PortfolioProjects || {};
    const projectGrid = document.getElementById('projects-grid');

    function renderProjectCards(projects) {
      if (!projects.length) {
        projectGrid.innerHTML = '<p class="empty-projects">Project data did not load. Refresh the page.</p>';
        return;
      }

      projectGrid.innerHTML = projects
        .map((project, index) => {
          const label = String(index + 1).padStart(2, '0');
          const media = project.mediaType === 'video'
            ? `<video class="project-media" src="${portfolio.escapeHtml(project.mediaSrc)}" muted playsinline preload="metadata"></video>`
            : `<img class="project-media" src="${portfolio.escapeHtml(project.mediaSrc)}" alt="${portfolio.escapeHtml(project.mediaAlt || project.title)}">`;

          return `
            <a class="project-card" data-project="${portfolio.escapeHtml(project.id)}" href="${portfolio.escapeHtml(portfolio.projectCardHref(project))}">
              <div class="project-media-wrap">
                ${media}
              </div>
              <div class="project-body">
                <div class="project-meta">
                  <span>${label}</span>
                  <time datetime="${portfolio.escapeHtml(project.date || '')}">${portfolio.escapeHtml(portfolio.formatProjectDate(project.date))}</time>
                </div>
                <h2>${portfolio.escapeHtml(project.title)}</h2>
                <div class="project-card-copy">${portfolio.renderMarkdown(project.cardMarkdown)}</div>
              </div>
            </a>
          `;
        })
        .join('');
    }

    const projectList = portfolio.projects && Array.isArray(portfolio.projects) ? portfolio.projects : [];
    renderProjectCards(projectList);
  </script>
</body>
</html>
