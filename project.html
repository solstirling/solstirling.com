<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | Sol Stirling Maker Portfolio</title>
  <script src="projects-data.js?v=20260802-2"></script>
  <link rel="stylesheet" href="site.css?v=20260802-2">
</head>
<body>
  <nav class="site-nav" aria-label="Project navigation">
    <a href="index.html" class="logo-only project-logo" aria-label="Sol Stirling home">
      <img src="images/logo.png" alt="Sol Stirling logo">
    </a>
    <a class="back-link" href="index.html">back to projects</a>
  </nav>

  <main class="site-frame project-shell">
    <article id="project-content" class="project-detail"></article>
  </main>

  <script>
    const portfolio = window.PortfolioProjects || {};
    const content = document.getElementById('project-content');

    function renderHeroMedia(project) {
      if (project.hideHeroMedia || !project.mediaSrc) return '';

      if (project.mediaType === 'video') {
        return `<video class="project-hero-media" src="${portfolio.escapeHtml(project.mediaSrc)}" controls playsinline preload="metadata"></video>`;
      }

      return `<img class="project-hero-media" src="${portfolio.escapeHtml(project.mediaSrc)}" alt="${portfolio.escapeHtml(project.mediaAlt || project.title)}">`;
    }

    function renderProject(project) {
      const heroMedia = renderHeroMedia(project);
      const externalAction = project.externalLink
        ? `<a class="project-action" href="${portfolio.escapeHtml(project.externalLink)}" target="_blank" rel="noopener noreferrer">open live project</a>`
        : '';

      content.dataset.project = project.id;
      content.innerHTML = `
        <div class="project-heading">
          <p class="status-line">${portfolio.escapeHtml(project.status || 'project')}${project.date ? ` / ${portfolio.escapeHtml(portfolio.formatProjectDate(project.date, { includeDay: true }))}` : ''}</p>
          <h1 class="project-title">${portfolio.escapeHtml(project.title)}</h1>
          <div class="project-lede markdown-copy">${portfolio.renderMarkdown(project.cardMarkdown)}</div>
          ${externalAction}
        </div>
        ${heroMedia}
        <div class="content-stack markdown-copy">${portfolio.renderMarkdown(project.bodyMarkdown)}</div>
      `;
      document.title = `${project.title} | Sol Stirling Maker Portfolio`;
    }

    function renderError() {
      content.innerHTML = '<p class="error-text">Project file not found.</p>';
    }

    const slug = new URLSearchParams(window.location.search).get('project');
    const projects = portfolio.projects && Array.isArray(portfolio.projects) ? portfolio.projects : [];
    const project = projects.find((item) => item.id === slug);

    if (project) {
      renderProject(project);
    } else {
      renderError();
    }
  </script>
</body>
</html>
